name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check scripts/smoke-test.mjs
          node --check scripts/security-test.mjs

      - name: Start test server
        env:
          TWILIO_AUTH_TOKEN: ci-test-token
          PUBLIC_BASE_URL: http://127.0.0.1:3000
          ENABLE_OLLAMA: "false"
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          sleep 2

      - name: Run smoke test
        run: |
          mkdir -p demo-generated
          npm test 2>&1 | tee demo-generated/smoke-test.txt

      - name: Run signed webhook security test
        env:
          TWILIO_AUTH_TOKEN: ci-test-token
        run: npm run test:security 2>&1 | tee demo-generated/security-test.txt

      - name: Install Chromium for evidence capture
        run: npx playwright install chromium

      - name: Capture real demo evidence
        run: node scripts/capture-demo-evidence.mjs

      - name: Upload demo evidence
        uses: actions/upload-artifact@v7
        with:
          name: freebot-demo-evidence
          path: demo-generated/
          if-no-files-found: error

      - name: Publish clean evidence branch
        run: |
          rm -rf /tmp/freebot-evidence
          mkdir -p /tmp/freebot-evidence/screenshots /tmp/freebot-evidence/logs
          cp demo-generated/01-homepage.png /tmp/freebot-evidence/screenshots/
          cp demo-generated/02-local-status.png /tmp/freebot-evidence/screenshots/
          cp demo-generated/03-server-startup.png /tmp/freebot-evidence/screenshots/
          cp demo-generated/04-smoke-tests.png /tmp/freebot-evidence/screenshots/
          cp demo-generated/05-security-tests.png /tmp/freebot-evidence/screenshots/
          cp demo-generated/smoke-test.txt /tmp/freebot-evidence/logs/
          cp demo-generated/security-test.txt /tmp/freebot-evidence/logs/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B evidence/generated-demo origin/main

          mkdir -p demo/screenshots demo/logs
          cp /tmp/freebot-evidence/screenshots/* demo/screenshots/
          cp /tmp/freebot-evidence/logs/* demo/logs/

          git add demo/screenshots demo/logs
          git commit -m "Add verified automated demo evidence"
          git push --force origin evidence/generated-demo

      - name: Show server log on failure
        if: failure()
        run: cat server.log || true

      - name: Stop test server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
